<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遊蕩犬管制模擬：三種外勤任務</title>
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#edf1ef; --panel:#ffffff; --ink:#19262d; --muted:#566870; --line:#cfd9d6;
  --accent:#0c7a7e; --on-accent:#ffffff; --amber:#b9731a; --blue:#2f6fb3; --danger:#b8432c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11191d; --panel:#1a252a; --ink:#e6eeee; --muted:#98aab0; --line:#2c3a40;
    --accent:#3cb7b9; --on-accent:#072426; --amber:#e0a04a; --blue:#6aa5e0; --danger:#e0775f;
  }
}
:root[data-theme="dark"]{
  --bg:#11191d; --panel:#1a252a; --ink:#e6eeee; --muted:#98aab0; --line:#2c3a40;
  --accent:#3cb7b9; --on-accent:#072426; --amber:#e0a04a; --blue:#6aa5e0; --danger:#e0775f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- 首頁 ---------- */
.home{max-width:880px;margin:0 auto;padding:44px 20px 56px}
.home h1{font-size:clamp(2.1rem,7vw,3.5rem);font-weight:800;line-height:1.12;margin:0 0 14px;letter-spacing:.01em}
.home .lead{max-width:34em;color:var(--muted);font-size:1.05rem;margin:0}
.modes{margin-top:34px;border-top:1px solid var(--line)}
.mode{
  display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;
  width:100%;text-align:left;background:transparent;border:0;border-left:5px solid transparent;
  border-bottom:1px solid var(--line);padding:20px 12px;cursor:pointer;
}
.mode:hover{background:var(--panel);border-left-color:var(--c)}
.mode:focus-visible{outline-offset:-3px}
.mode svg{width:64px;height:64px;color:var(--c)}
.mode h2{margin:0 0 4px;font-size:1.22rem}
.mode p{margin:0;color:var(--muted);font-size:.93rem;max-width:36em}
.mode .best{font-size:.85rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{margin-top:28px;font-size:.85rem;color:var(--muted);max-width:40em}

/* ---------- 遊戲畫面 ---------- */
.stage{max-width:1040px;margin:0 auto;padding:14px 16px 40px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar h2{margin:0;font-size:1.15rem}
.back{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.hud{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hud span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;
  font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.hud span:empty{display:none}
.stagegrid{display:block}
.stagegrid.side{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
.wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0b1114;user-select:none;-webkit-user-select:none}
.wrap canvas{display:block;width:100%;height:100%}
.wrap canvas.aim{touch-action:none;cursor:crosshair}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  gap:10px;padding:clamp(14px,5%,40px);background:rgba(8,18,22,.86);color:#eef6f6;overflow:auto;
}
.overlay h3{margin:0;font-size:clamp(1.2rem,3.4vw,1.7rem)}
.overlay ul{margin:0;padding-left:1.15em;max-width:38em;font-size:clamp(.85rem,2.2vw,1rem)}
.overlay li{margin:3px 0}
.overlay .big{margin:0;font-size:clamp(2rem,8vw,3.4rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.overlay .sub{margin:0;color:#b9cbcf;font-size:.92rem}
.orow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid rgba(255,255,255,.4);background:transparent;color:#eef6f6;border-radius:10px;padding:9px 18px;cursor:pointer;font-weight:600}
.btn.primary{background:#3cb7b9;border-color:#3cb7b9;color:#052426}
.extra{margin-top:12px}
.ctrl{display:flex;gap:10px;flex-wrap:wrap}
.tbtn{flex:1 1 150px;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  font-weight:700;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.tbtn[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1d1204}
.tbtn.held{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{color:var(--muted);font-size:.85rem;margin:10px 0 0}

/* ---------- 模擬手機 ---------- */
.phone{background:#0f171b;color:#e8f1f1;border-radius:30px;padding:12px 12px 16px;border:3px solid #2a3940}
.phone-notch{width:64px;height:6px;border-radius:3px;background:#2a3940;margin:0 auto 10px}
.phone-head{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;margin-bottom:8px}
.phone-head span{color:#8fd6a5}
.phone canvas{width:100%;display:block;border-radius:10px;background:#000;aspect-ratio:16/9}
.gate-row{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 8px;font-size:.92rem}
.gate-row b{font-variant-numeric:tabular-nums}
.gate-btn{width:100%;padding:15px 10px;border:0;border-radius:14px;font-weight:800;font-size:1.05rem;cursor:pointer;
  background:#e0775f;color:#2a0d06}
.gate-btn[data-act="open"]{background:#3cb7b9;color:#052426}
.gate-btn:disabled{opacity:.55;cursor:default}
.plog{list-style:none;margin:12px 2px 0;padding:0;font-size:.78rem;color:#9fb4b8;min-height:5.6em}
.plog li{margin:2px 0}
.plog li:first-child{color:#e8f1f1}
.phone .tip{margin:8px 2px 0;font-size:.76rem;color:#7f9398}

@media (max-width:760px){
  .stagegrid.side{grid-template-columns:1fr}
  .phone{max-width:320px;margin:0 auto}
  .mode{grid-template-columns:56px 1fr;padding:16px 8px}
  .mode svg{width:52px;height:52px}
  .mode .best{grid-column:2}
}
</style>
</head>
<body>

<main>
  <section id="home" class="home">
    <h1>遊蕩犬管制模擬</h1>
    <p class="lead">三種外勤任務，目標一致：把犬隻帶離道路，降低追咬與車禍風險，同時不傷害動物、不誤捕有項圈的家犬。</p>
    <div class="modes">
      <button class="mode" data-mode="fence" style="--c:var(--accent)">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true">
          <path d="M10 14h44v36H10V37M10 27V14"/><path d="M10 27l-6 -6"/>
          <circle cx="40" cy="34" r="4.5" fill="currentColor" stroke="none"/><circle cx="46" cy="34" r="2.6" fill="currentColor" stroke="none"/>
        </svg>
        <div><h2>巨型智慧捕犬圍籬</h2><p>看著監視器，在犬隻走進圍籬的瞬間用手機遠端關閘，捕得越多分數越高。</p></div>
        <span class="best" id="best-fence"></span>
      </button>
      <button class="mode" data-mode="dart" style="--c:var(--amber)">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="32" cy="32" r="18"/><path d="M32 6v12M32 46v12M6 32h12M46 32h12"/>
          <circle cx="32" cy="32" r="3" fill="currentColor" stroke="none"/>
        </svg>
        <div><h2>吹箭麻醉捕捉</h2><p>預判犬隻的移動方向，射出麻醉吹箭，再派隊員在牠醒來前完成捕捉。</p></div>
        <span class="best" id="best-dart"></span>
      </button>
      <button class="mode" data-mode="drone" style="--c:var(--blue)">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true">
          <path d="M22 22l20 20M42 22L22 42"/>
          <circle cx="16" cy="16" r="7"/><circle cx="48" cy="16" r="7"/><circle cx="16" cy="48" r="7"/><circle cx="48" cy="48" r="7"/>
        </svg>
        <div><h2>無人機搜索</h2><p>在樹叢與建物之間飛行，用熱像找出躲起來的犬隻，並分辨誤報的熱源。</p></div>
        <span class="best" id="best-drone"></span>
      </button>
    </div>
    <p class="note">這是簡化的示意遊戲，靈感來自新聞報導的 AI 與無人機遊蕩犬管制應用，並非任何機構的官方軟體，內容與真實系統細節無關。</p>
  </section>

  <section id="stage" class="stage" hidden>
    <div class="bar">
      <button class="back" id="back">返回選單</button>
      <h2 id="stageTitle"></h2>
      <div class="hud"><span id="hudScore"></span><span id="hudTime"></span><span id="hudExtra"></span></div>
    </div>
    <div id="stageBody"></div>
  </section>
</main>

<script>
(()=>{
'use strict';
const W=800,H=450,TAU=Math.PI*2;
const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const $=(s,r=document)=>r.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const BEST_KEY={fence:'dogsim-best-fence',dart:'dogsim-best-dart',drone:'dogsim-best-drone'};
function getBest(id){try{return +localStorage.getItem(BEST_KEY[id])||0}catch(e){return 0}}
function setBest(id,v){try{localStorage.setItem(BEST_KEY[id],String(v))}catch(e){}}
function refreshBests(){
  for(const id of Object.keys(BEST_KEY)){
    const b=getBest(id);
    $('#best-'+id).textContent=b?('最高 '+b+' 分'):'尚未挑戰';
  }
}

/* ---------- 共用繪圖工具 ---------- */
function text(c,s,x,y,o={}){
  c.save();
  c.font=(o.w||600)+' '+(o.s||14)+'px '+FONT;
  c.textAlign=o.a||'left'; c.textBaseline=o.b||'alphabetic';
  if(o.stroke){c.lineWidth=3;c.strokeStyle=o.stroke;c.lineJoin='round';c.strokeText(s,x,y);}
  c.fillStyle=o.c||'#fff'; c.fillText(s,x,y);
  c.restore();
}
function makeBg(fn){const o=document.createElement('canvas');o.width=W;o.height=H;fn(o.getContext('2d'));return o;}
function angLerp(a,b,t){let d=b-a;d=Math.atan2(Math.sin(d),Math.cos(d));return a+d*t;}
function step(d,tx,ty,dt,m=1){
  const dx=tx-d.x,dy=ty-d.y,dd=Math.hypot(dx,dy);
  if(dd<0.5)return dd;
  d.ang=angLerp(d.ang,Math.atan2(dy,dx),Math.min(1,dt*12));
  const s=Math.min(dd,d.spd*m*dt);
  d.x+=Math.cos(d.ang)*s; d.y+=Math.sin(d.ang)*s;
  return Math.hypot(tx-d.x,ty-d.y);
}
const COLORS=['#c79a62','#8a6a48','#3b3a3a','#d8cdb8','#a6753f','#6c5a4a'];
const PATCHES=[null,null,'#efe6d4','#5a4636'];
function newDog(x,y,collar){
  return {x,y,ang:rand(0,TAU),spd:rand(55,85),collar:!!collar,color:pick(COLORS),patch:pick(PATCHES),
    seed:Math.random()*10,conf:Math.round(rand(88,99)),state:'wander',t:rand(1.5,3),wp:null};
}
function drawDog(c,d,t,o={}){
  c.save(); c.translate(d.x,d.y); c.rotate(d.ang||0);
  const s=d.scale||1; c.scale(s,s);
  c.fillStyle='rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(2,4,15,8,0,0,TAU); c.fill();
  const wag=o.still?0:Math.sin(t*12+(d.seed||0))*0.5;
  c.strokeStyle=d.color; c.lineWidth=3; c.lineCap='round';
  c.beginPath(); c.moveTo(-12,0); c.quadraticCurveTo(-18,wag*7,-21,wag*11); c.stroke();
  c.fillStyle=d.color; c.beginPath(); c.ellipse(0,0,14,7.5,0,0,TAU); c.fill();
  if(d.patch){c.fillStyle=d.patch;c.beginPath();c.ellipse(-3,-1.5,6,4,0.3,0,TAU);c.fill();}
  c.fillStyle=d.color; c.beginPath(); c.arc(14,0,6.5,0,TAU); c.fill();
  c.fillStyle='rgba(30,18,8,.5)';
  c.beginPath(); c.ellipse(12,-6,3.6,2.2,0.5,0,TAU); c.fill();
  c.beginPath(); c.ellipse(12,6,3.6,2.2,-0.5,0,TAU); c.fill();
  c.fillStyle='#2a1d14'; c.beginPath(); c.ellipse(19.5,0,2.8,2.3,0,0,TAU); c.fill();
  if(d.collar){c.strokeStyle='#e5322d';c.lineWidth=2.6;c.beginPath();c.moveTo(8.5,-6.6);c.lineTo(8.5,6.6);c.stroke();}
  c.restore();
}
function drawTree(g,x,y,r){
  g.fillStyle='rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(x+6,y+8,r,r*.9,0,0,TAU); g.fill();
  const gr=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
  gr.addColorStop(0,'#4f7d3b'); gr.addColorStop(1,'#2b4d26');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  g.fillStyle='rgba(255,255,255,.07)';
  for(let i=0;i<10;i++){g.beginPath();g.arc(x+rand(-r*.6,r*.6),y+rand(-r*.6,r*.6),rand(2,5),0,TAU);g.fill();}
}
function addFloat(list,x,y,t,col){list.push({x,y,t,col,a:0});}
function updFloats(list,dt){
  for(let i=list.length-1;i>=0;i--){const f=list[i];f.a+=dt;f.y-=26*dt;if(f.a>1.6)list.splice(i,1);}
}
function drawFloats(c,list){
  for(const f of list){
    c.globalAlpha=clamp(1-f.a/1.6,0,1);
    text(c,f.t,clamp(f.x,70,W-70),f.y,{a:'center',s:16,w:800,c:f.col||'#fff',stroke:'rgba(0,0,0,.7)'});
  }
  c.globalAlpha=1;
}

/* ---------- 遊戲外殼 ---------- */
const shell={state:'idle',mode:null,id:null,raf:0,last:0,ov:null};
const MODES={};
const home=$('#home'),stageEl=$('#stage'),body=$('#stageBody');

function overlay(title,lines,btns,big,sub){
  const ov=shell.ov; ov.innerHTML=''; ov.hidden=false;
  const h=document.createElement('h3'); h.textContent=title; ov.append(h);
  if(big!==undefined){const p=document.createElement('p');p.className='big';p.textContent=big;ov.append(p);}
  if(sub){const p=document.createElement('p');p.className='sub';p.textContent=sub;ov.append(p);}
  if(lines&&lines.length){
    const ul=document.createElement('ul');
    lines.forEach(l=>{const li=document.createElement('li');li.textContent=l;ul.append(li);});
    ov.append(ul);
  }
  const row=document.createElement('div'); row.className='orow';
  btns.forEach(b=>{
    const bt=document.createElement('button'); bt.textContent=b.t;
    bt.className=b.p?'btn primary':'btn'; bt.addEventListener('click',b.f); row.append(bt);
  });
  ov.append(row);
}
function showIntro(){
  const m=shell.mode;
  shell.state='intro';
  overlay(m.intro.h,m.intro.l,[{t:'開始任務',p:1,f:startGame},{t:'返回選單',f:closeMode}]);
}
function startGame(){
  shell.mode.reset();
  shell.state='play';
  shell.ov.hidden=true;
}
function finish(o){
  if(shell.state!=='play')return;
  const m=shell.mode;
  shell.state='over';
  const score=Math.round(m.score);
  const prev=getBest(shell.id);
  const nb=score>prev;
  if(nb)setBest(shell.id,score);
  overlay(o.title,o.lines||[],[{t:'再玩一次',p:1,f:startGame},{t:'返回選單',f:closeMode}],score+' 分',
    nb?'新的最高分':('最高 '+Math.max(prev,score)+' 分'));
}
function updateHud(){
  const m=shell.mode;if(!m)return;
  $('#hudScore').textContent='分數 '+Math.round(m.score);
  $('#hudTime').textContent='剩 '+Math.max(0,Math.ceil(m.time))+' 秒';
  $('#hudExtra').textContent=m.hudExtra?m.hudExtra():'';
}
function loop(now){
  const m=shell.mode;if(!m)return;
  const dt=Math.min(0.05,Math.max(0,(now-shell.last)/1000)); shell.last=now;
  if(shell.state==='play')m.update(dt);
  m.draw();
  updateHud();
  shell.raf=requestAnimationFrame(loop);
}
function openMode(id){
  closeMode(true);
  const m=MODES[id]();
  shell.mode=m; shell.id=id; shell.state='idle';
  $('#stageTitle').textContent=m.title;
  body.innerHTML='';
  const grid=document.createElement('div'); grid.className='stagegrid'+(m.layout==='side'?' side':'');
  const wrap=document.createElement('div'); wrap.className='wrap';
  const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
  if(m.aimCanvas)canvas.classList.add('aim');
  const ov=document.createElement('div'); ov.className='overlay';
  wrap.append(canvas,ov);
  const extra=document.createElement('div'); extra.className='extra';
  grid.append(wrap,extra); body.append(grid);
  shell.ov=ov;
  m.mount({canvas,ctx:canvas.getContext('2d'),extra});
  m.reset();
  home.hidden=true; stageEl.hidden=false;
  window.scrollTo(0,0);
  showIntro();
  shell.last=performance.now();
  shell.raf=requestAnimationFrame(loop);
}
function closeMode(silent){
  cancelAnimationFrame(shell.raf);
  if(shell.mode&&shell.mode.unmount)shell.mode.unmount();
  shell.mode=null; shell.state='idle';
  body.innerHTML='';
  if(!silent){stageEl.hidden=true;home.hidden=false;refreshBests();}
}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>openMode(b.dataset.mode)));
$('#back').addEventListener('click',()=>closeMode());

function bindKeys(list){
  const offs=[];
  for(const [type,fn] of list){window.addEventListener(type,fn);offs.push(()=>window.removeEventListener(type,fn));}
  return ()=>offs.forEach(f=>f());
}
const inOverlay=e=>e.target&&e.target.closest&&e.target.closest('.overlay');

/* =====================================================
   模式一：巨型智慧捕犬圍籬
   ===================================================== */
MODES.fence=function(){
  const G={title:'巨型智慧捕犬圍籬',score:0,time:60,layout:'side'};
  G.intro={h:'巨型智慧捕犬圍籬',l:[
    '犬隻會被餌料吸引，走進圍籬。看著監視器畫面，在牠進入後用右側的手機遠端關閘。',
    '關閘瞬間在圍籬內的遊蕩犬都會被捕獲：每隻 +10 分，一次捕到多隻另加 +5 分連捕獎勵。',
    'AI 會框出犬隻：紅框是遊蕩犬，綠框是有項圈的家犬。關到家犬會扣 15 分。',
    '指令傳送與閘門移動都有延遲，要抓準時機。犬隻吃完餌料會自己離開。空白鍵也能開關閘門，時間 60 秒。'
  ]};
  const enc={x:360,y:105,w:350,h:245};
  const gateY1=205,gateY2=255;
  const bait={x:620,y:230},gateOut={x:322,y:230},gateIn={x:394,y:230};
  let c,ctx,bg,fx,mini,mctx,pBtn,pState,pLog,off;
  let dogs,floats,spawnT,gateOpen,openAmt,pending,closedDone,logs,stats,clock;
  let lastBtn='',lastState='';
  const PHONE=`<div class="phone">
    <div class="phone-notch"></div>
    <div class="phone-head"><b>智慧捕犬</b><span>訊號良好</span></div>
    <canvas id="pMini" width="220" height="124"></canvas>
    <div class="gate-row"><span>東側閘門</span><b id="pState">開啟</b></div>
    <button class="gate-btn" id="pBtn" data-act="close">關閉閘門</button>
    <ul class="plog" id="pLog"></ul>
    <p class="tip">電腦可按空白鍵遠端開關。</p>
  </div>`;

  function fenceBg(g){
    const gr=g.createLinearGradient(0,0,W,H); gr.addColorStop(0,'#7c9461'); gr.addColorStop(1,'#8d9a68');
    g.fillStyle=gr; g.fillRect(0,0,W,H);
    for(let i=0;i<1800;i++){
      g.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.07)';
      g.fillRect(Math.random()*W,Math.random()*H,rand(1,3),rand(1,3));
    }
    g.fillStyle='rgba(176,150,104,.7)'; g.beginPath(); g.ellipse(240,230,150,70,0,0,TAU); g.fill();
    g.fillStyle='rgba(200,185,140,.4)'; g.fillRect(enc.x,enc.y,enc.w,enc.h);
    for(const t of [[70,70,30],[170,385,34],[300,55,26],[745,395,32],[520,398,26],[765,55,30]])drawTree(g,t[0],t[1],t[2]);
  }
  function makeFx(){
    return makeBg(g=>{
      const v=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);
      v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.42)');
      g.fillStyle=v; g.fillRect(0,0,W,H);
      g.fillStyle='rgba(0,0,0,.07)'; for(let y=0;y<H;y+=3)g.fillRect(0,y,W,1);
      g.fillStyle='rgba(30,70,90,.08)'; g.fillRect(0,0,W,H);
    });
  }
  function log(s){logs.unshift(s);if(logs.length>5)logs.pop();renderLog();}
  function renderLog(){
    pLog.innerHTML='';
    logs.forEach(s=>{const li=document.createElement('li');li.textContent=s;pLog.append(li);});
  }
  function toggle(){
    if(shell.state!=='play'||pending)return;
    pending={want:!gateOpen,t:0.35};
    log('指令傳送中…');
  }
  G.mount=o=>{
    c=o.canvas; ctx=o.ctx; bg=makeBg(fenceBg); fx=makeFx();
    o.extra.innerHTML=PHONE;
    mini=o.extra.querySelector('#pMini'); mctx=mini.getContext('2d');
    pBtn=o.extra.querySelector('#pBtn'); pState=o.extra.querySelector('#pState'); pLog=o.extra.querySelector('#pLog');
    pBtn.addEventListener('click',toggle);
    off=bindKeys([
      ['keydown',e=>{if(e.code==='Space'&&!inOverlay(e)){e.preventDefault();if(!e.repeat)toggle();}}],
      ['keyup',e=>{if(e.code==='Space'&&!inOverlay(e))e.preventDefault();}]
    ]);
  };
  G.unmount=()=>{if(off)off();};
  G.reset=()=>{
    G.score=0;G.time=60;dogs=[];floats=[];spawnT=0.5;gateOpen=true;openAmt=1;pending=null;
    closedDone=true;logs=[];stats={caught:0,wrong:0};clock=0;lastBtn='';lastState='';
    log('已連線，閘門開啟');
  };
  function spawn(){
    const d=newDog(-25,rand(40,410),Math.random()<0.25);
    d.bx=bait.x+rand(-35,35); d.by=bait.y+rand(-35,35); d.exitY=rand(40,410); d.leg=0; d.ang=0;
    dogs.push(d);
  }
  function updateDog(d,dt){
    const open=openAmt>0.8;
    switch(d.state){
      case 'wander':
        if(!d.wp||Math.hypot(d.wp.x-d.x,d.wp.y-d.y)<12)d.wp={x:rand(15,290),y:rand(30,420)};
        step(d,d.wp.x,d.wp.y,dt,0.7); d.t-=dt;
        if(d.t<=0){if(!d.collar||Math.random()<0.6)d.state='approach';else d.t=rand(2,4);}
        break;
      case 'approach':
        if(step(d,gateOut.x,gateOut.y,dt,1)<14){
          if(open)d.state='enter'; else{d.state='wait';d.t=rand(2,3.5);}
        }
        break;
      case 'wait':
        d.ang=angLerp(d.ang,0,Math.min(1,dt*4)); d.t-=dt;
        if(open)d.state='enter';
        else if(d.t<=0){d.state='wander';d.t=rand(2,4);d.wp=null;}
        break;
      case 'enter':
        if(d.x<enc.x-16&&!open){d.state='wait';d.t=rand(2,3);break;}
        if(d.x<gateIn.x-6)step(d,gateIn.x,gateIn.y,dt,1);
        else if(step(d,d.bx,d.by,dt,0.9)<12){d.state='eat';d.t=rand(1.8,3.2);}
        break;
      case 'eat':
        d.t-=dt; d.ang+=Math.sin(clock*3+d.seed)*dt*1.5;
        if(d.t<=0){d.state='leave';d.leg=0;}
        break;
      case 'leave':
        if(d.leg===0){if(step(d,gateIn.x,gateIn.y,dt,1)<14)d.leg=1;}
        else if(d.leg===1){if(step(d,gateOut.x,gateOut.y,dt,1)<14)d.leg=2;}
        else{step(d,-60,d.exitY,dt,1);if(d.x<-30)d.gone=true;}
        break;
    }
  }
  function doCapture(){
    let ns=0,nc=0;
    for(const d of dogs){
      if(d.x>enc.x+12){
        d.gone=true;
        if(d.collar)nc++; else ns++;
      }else if(d.x>enc.x-18){
        d.x=enc.x-22;
        if(d.state==='enter'){d.state='wait';d.t=2;}
        else if(d.state==='leave'){d.leg=2;}
      }
    }
    const gain=ns*10+Math.max(0,ns-1)*5, loss=nc*15;
    G.score=Math.max(0,G.score+gain-loss);
    stats.caught+=ns; stats.wrong+=nc;
    if(ns)addFloat(floats,gateOut.x+40,gateOut.y-20,'捕獲 '+ns+' 隻 +'+gain,'#7dffb0');
    if(nc)addFloat(floats,gateOut.x+40,gateOut.y+10,'誤關家犬 −'+loss,'#ff8a76');
    if(!ns&&!nc){log('閘門已關閉，圍籬內沒有犬隻');addFloat(floats,gateOut.x+40,gateOut.y,'空關','#d9e6e8');}
    else log('閘門已關閉：捕獲 '+ns+' 隻'+(nc?('，誤關家犬 '+nc+' 隻已放走'):''));
  }
  G.update=dt=>{
    G.time-=dt; clock+=dt;
    if(pending){
      pending.t-=dt;
      if(pending.t<=0){
        gateOpen=pending.want; pending=null; closedDone=gateOpen;
        log(gateOpen?'閘門開啟中':'閘門關閉中');
      }
    }
    openAmt+=clamp((gateOpen?1:0)-openAmt,-2.4*dt,2.4*dt);
    if(!gateOpen&&!closedDone&&openAmt<0.1){doCapture();closedDone=true;}
    spawnT-=dt;
    if(spawnT<=0&&dogs.length<6){spawn();spawnT=rand(1.6,3.0);}
    for(const d of dogs)updateDog(d,dt);
    dogs=dogs.filter(d=>!d.gone);
    updFloats(floats,dt);
    if(G.time<=0){
      G.time=0;
      finish({title:'時間到',lines:['成功捕獲遊蕩犬 '+stats.caught+' 隻','誤關家犬 '+stats.wrong+' 隻']});
    }
  };
  function drawFence(){
    ctx.save();
    ctx.lineCap='round';
    ctx.strokeStyle='#e3e9ec'; ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(enc.x,gateY1); ctx.lineTo(enc.x,enc.y); ctx.lineTo(enc.x+enc.w,enc.y);
    ctx.lineTo(enc.x+enc.w,enc.y+enc.h); ctx.lineTo(enc.x,enc.y+enc.h); ctx.lineTo(enc.x,gateY2);
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5; ctx.setLineDash([3,4]);
    ctx.strokeRect(enc.x+4,enc.y+4,enc.w-8,enc.h-8);
    ctx.setLineDash([]);
    ctx.fillStyle='#b7c0c4';
    for(let x=enc.x;x<=enc.x+enc.w;x+=35){ctx.beginPath();ctx.arc(x,enc.y,3.5,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(x,enc.y+enc.h,3.5,0,TAU);ctx.fill();}
    for(let y=enc.y;y<=enc.y+enc.h;y+=35){ctx.beginPath();ctx.arc(enc.x+enc.w,y,3.5,0,TAU);ctx.fill();}
    ctx.beginPath();ctx.arc(enc.x,gateY1,5,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(enc.x,gateY2,5,0,TAU);ctx.fill();
    const th=lerp(Math.PI/2,Math.PI,openAmt);
    ctx.strokeStyle=openAmt<0.5?'#ffb347':'#9fe6a8'; ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(enc.x,gateY1);ctx.lineTo(enc.x+Math.cos(th)*50,gateY1+Math.sin(th)*50);ctx.stroke();
    ctx.restore();
  }
  function drawBait(){
    ctx.fillStyle='#6d5230'; ctx.beginPath(); ctx.arc(bait.x,bait.y,13,0,TAU); ctx.fill();
    ctx.fillStyle='#c9a06a'; ctx.beginPath(); ctx.arc(bait.x,bait.y,9,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(bait.x-5,bait.y-1.5,10,3);
    ctx.beginPath(); ctx.arc(bait.x-5,bait.y,2.4,0,TAU); ctx.arc(bait.x+5,bait.y,2.4,0,TAU); ctx.fill();
  }
  function drawBox(d){
    const col=d.collar?'#3be58a':'#ff5a47';
    const w=52,h=38,x=d.x-w/2,y=d.y-h/2;
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.strokeRect(x,y,w,h);
    const s=(d.collar?'家犬 項圈 ':'遊蕩犬 ')+d.conf+'%';
    ctx.font='700 11px '+FONT;
    const tw=ctx.measureText(s).width+8, ly=y>16?y-15:y+h;
    ctx.fillStyle=col; ctx.fillRect(x,ly,tw,15);
    text(ctx,s,x+4,ly+11.5,{s:11,w:700,c:'#071012'});
  }
  G.draw=()=>{
    ctx.drawImage(bg,0,0);
    drawFence(); drawBait();
    const sorted=dogs.slice().sort((a,b)=>a.y-b.y);
    for(const d of sorted)drawDog(ctx,d,clock,{still:d.state==='wait'});
    for(const d of sorted)drawBox(d);
    drawFloats(ctx,floats);
    ctx.drawImage(fx,0,0);
    const now=new Date(), p=n=>String(n).padStart(2,'0');
    text(ctx,'CAM 02  圍籬東門',14,26,{s:14,w:700,stroke:'rgba(0,0,0,.6)'});
    text(ctx,now.getFullYear()+'/'+p(now.getMonth()+1)+'/'+p(now.getDate())+'  '+p(now.getHours())+':'+p(now.getMinutes())+':'+p(now.getSeconds()),W-14,26,{s:13,a:'right',stroke:'rgba(0,0,0,.6)'});
    if(Math.floor(performance.now()/600)%2===0){ctx.fillStyle='#ff3b30';ctx.beginPath();ctx.arc(W-150,48,5,0,TAU);ctx.fill();}
    text(ctx,'REC',W-140,52,{s:12,w:700,stroke:'rgba(0,0,0,.6)'});
    text(ctx,'AI 辨識：開啟',14,H-14,{s:12,c:'#9fe6a8',stroke:'rgba(0,0,0,.6)'});
    mctx.drawImage(c,0,0,mini.width,mini.height);
    const st=pending?'傳送中…':(openAmt>0.95?'開啟':openAmt<0.05?'關閉':'移動中');
    if(st!==lastState){pState.textContent=st;lastState=st;}
    const bt=pending?'指令傳送中…':(gateOpen?'關閉閘門':'開啟閘門');
    if(bt!==lastBtn){pBtn.textContent=bt;pBtn.disabled=!!pending;pBtn.dataset.act=gateOpen?'close':'open';lastBtn=bt;}
  };
  return G;
};

/* =====================================================
   模式二：吹箭麻醉捕捉
   ===================================================== */
MODES.dart=function(){
  const G={title:'吹箭麻醉捕捉',score:0,time:75,aimCanvas:true,layout:'below'};
  G.intro={h:'吹箭麻醉捕捉',l:[
    '按住畫面瞄準，按得越久準星越穩，放開就射出吹箭。犬隻會移動，要預判牠的位置。',
    '吹箭命中後犬隻會慢慢昏睡。在牠醒來前（約 8 秒）點一下牠，派隊員前往捕捉，隊員同時只能處理一隻。',
    '紅項圈是家犬，誤射扣 20 分。吹箭只有 9 支，射程在虛線以內。時間 75 秒。'
  ]};
  const shooter={x:400,y:440},RANGE=340,base={x:44,y:424};
  let c,ctx,bg,off,dogs,darts,floats,ammo,team,aim,down,holdT,clock,stats;

  function dartBg(g){
    g.fillStyle='#7fa05a'; g.fillRect(0,0,W,H);
    for(let i=0;i<14;i++){g.fillStyle=i%2?'rgba(255,255,255,.035)':'rgba(0,0,0,.035)';g.fillRect(i*W/14,0,W/14,H);}
    for(let i=0;i<1500;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.07)';g.fillRect(Math.random()*W,Math.random()*H,rand(1,3),rand(1,3));}
    g.strokeStyle='rgba(180,155,110,.8)'; g.lineWidth=36; g.lineCap='round';
    g.beginPath(); g.moveTo(-20,300); g.bezierCurveTo(200,240,300,380,520,300); g.bezierCurveTo(640,260,720,200,830,230); g.stroke();
    g.strokeStyle='rgba(120,100,70,.25)'; g.lineWidth=2; g.setLineDash([10,14]);
    g.beginPath(); g.moveTo(-20,300); g.bezierCurveTo(200,240,300,380,520,300); g.bezierCurveTo(640,260,720,200,830,230); g.stroke(); g.setLineDash([]);
    for(const t of [[40,50,34],[120,160,26],[700,70,36],[770,170,24],[260,40,24],[560,45,28],[30,250,22]])drawTree(g,t[0],t[1],t[2]);
    g.fillStyle='#e5e9e8'; g.fillRect(8,404,72,38); g.fillStyle='#2f6f8f'; g.fillRect(8,404,72,8);
    text(g,'捕犬車',44,432,{s:13,a:'center',c:'#26343a'});
  }
  function sway(){
    const dd=Math.hypot(aim.x-shooter.x,aim.y-shooter.y);
    const f=clamp(1-holdT/1.1,0.2,1), r=(7+dd/45)*f;
    return {x:Math.sin(clock*2.3)*r,y:Math.cos(clock*1.9+1)*r,f};
  }
  function toCanvas(e){
    const r=c.getBoundingClientRect();
    return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
  }
  G.mount=o=>{
    c=o.canvas; ctx=o.ctx; bg=makeBg(dartBg);
    o.extra.innerHTML='<p class="hint">按住畫面瞄準、放開射擊；虛線外射程不夠。射中後點昏睡的犬隻派隊員。紅項圈是家犬，不要射。</p>';
    const mv=e=>{const p=toCanvas(e);aim.x=p.x;aim.y=p.y;};
    c.addEventListener('pointermove',mv);
    c.addEventListener('pointerdown',e=>{
      if(shell.state!=='play')return;
      e.preventDefault(); try{c.setPointerCapture(e.pointerId);}catch(_){}
      mv(e); down=true; holdT=0;
    });
    c.addEventListener('pointerup',e=>{
      if(!down)return; down=false; mv(e); fire();
    });
    c.addEventListener('pointercancel',()=>{down=false;});
    off=null;
  };
  G.unmount=()=>{};
  G.reset=()=>{
    G.score=0;G.time=75;ammo=9;darts=[];floats=[];team=null;down=false;holdT=0;clock=0;
    aim={x:400,y:200};stats={caught:0,escaped:0,wrong:0};
    dogs=[];
    for(let i=0;i<7;i++){
      const d=newDog(rand(60,740),rand(70,330),i>=5);
      d.spd=rand(34,64); d.idle=rand(0,1.5); d.darted=false; d.targeted=false;
      dogs.push(d);
    }
  };
  G.hudExtra=()=>'吹箭 '+ammo+' 支';
  function fire(){
    if(shell.state!=='play')return;
    const sd=dogs.find(d=>d.state==='asleep'&&Math.hypot(d.x-aim.x,d.y-aim.y)<28);
    if(sd){
      if(sd.collar){addFloat(floats,sd.x,sd.y-24,'這是家犬','#ffd37a');return;}
      if(team){addFloat(floats,sd.x,sd.y-24,'隊員忙碌中','#ffd37a');return;}
      team={dog:sd,t:0,dur:0.9+Math.hypot(sd.x-base.x,sd.y-base.y)/260};
      sd.targeted=true;
      addFloat(floats,sd.x,sd.y-24,'隊員出發','#7fe6e8');
      return;
    }
    if(ammo<=0){addFloat(floats,aim.x,aim.y-20,'吹箭用完了','#ffd37a');return;}
    ammo--;
    const sw=sway();
    let tx=aim.x+sw.x,ty=aim.y+sw.y;
    const dd=Math.hypot(tx-shooter.x,ty-shooter.y);
    let short=false;
    if(dd>RANGE){short=true;const k=RANGE*0.9/dd;tx=shooter.x+(tx-shooter.x)*k;ty=shooter.y+(ty-shooter.y)*k;}
    darts.push({sx:shooter.x,sy:shooter.y-10,tx,ty,t:0,dur:clamp(dd/650,0.15,0.55),short});
  }
  function updDog(d,dt){
    switch(d.state){
      case 'wander':{
        if(d.idle>0){d.idle-=dt;break;}
        if(!d.wp)d.wp={x:rand(40,760),y:rand(60,380)};
        const m=d.darted?1.5:1;
        if(step(d,d.wp.x,d.wp.y,dt,m)<14){d.wp=null;d.idle=rand(0.4,1.6);}
        break;}
      case 'drowsy':{
        d.t-=dt;
        if(!d.wp)d.wp={x:clamp(d.x+Math.cos(d.ang)*80,40,760),y:clamp(d.y+Math.sin(d.ang)*80,60,380)};
        step(d,d.wp.x,d.wp.y,dt,clamp(d.t/2.2,0,1)*0.8+0.05);
        d.ang+=Math.sin(clock*9+d.seed)*dt*1.4;
        if(d.t<=0){d.state='asleep';d.sleep=d.collar?6:8;d.sleepMax=d.sleep;}
        break;}
      case 'asleep':
        d.sleep-=dt;
        if(d.sleep<=0){
          d.state='wander';d.wp=null;d.idle=0.5;d.targeted=false;
          if(!d.collar){d.escaped=true;stats.escaped++;addFloat(floats,d.x,d.y-24,'犬隻醒了','#ff8a76');}
        }
        break;
    }
  }
  G.update=dt=>{
    G.time-=dt; clock+=dt; if(down)holdT+=dt;
    for(const d of dogs)updDog(d,dt);
    for(let i=darts.length-1;i>=0;i--){
      const a=darts[i]; a.t+=dt;
      if(a.t>=a.dur){
        darts.splice(i,1);
        if(a.short){addFloat(floats,a.tx,a.ty-10,'射程不足','#ffd37a');continue;}
        const hit=dogs.find(d=>!d.darted&&Math.hypot(d.x-a.tx,d.y-a.ty)<19);
        if(hit){
          hit.darted=true; hit.state='drowsy'; hit.t=2.2; hit.wp=null;
          if(hit.collar){G.score=Math.max(0,G.score-20);stats.wrong++;addFloat(floats,hit.x,hit.y-24,'誤射家犬 −20','#ff8a76');}
          else{G.score+=10;addFloat(floats,hit.x,hit.y-24,'命中 +10','#7dffb0');}
        }else addFloat(floats,a.tx,a.ty-10,'未命中','#e8f1f1');
      }
    }
    if(team){
      if(team.dog.state!=='asleep'){
        addFloat(floats,team.dog.x,team.dog.y-24,'來不及了','#ff8a76');team=null;
      }else{
        team.t+=dt;
        if(team.t>=team.dur){
          const d=team.dog, bonus=Math.round(d.sleep*3);
          d.gone=true; stats.caught++; G.score+=25+bonus;
          addFloat(floats,d.x,d.y-24,'捕獲 +'+(25+bonus),'#7dffb0');
          team=null;
        }
      }
    }
    dogs=dogs.filter(d=>!d.gone);
    updFloats(floats,dt);
    const groggy=dogs.some(d=>d.state==='drowsy'||d.state==='asleep');
    const waiting=dogs.some(d=>!d.collar&&!d.darted);
    if(G.time<=0){G.time=0;end('時間到');}
    else if(!waiting&&!groggy&&!team&&darts.length===0)end('所有遊蕩犬都處理完了');
    else if(ammo<=0&&darts.length===0&&!groggy&&!team)end('吹箭用完了');
  };
  function end(t){
    finish({title:t,lines:['成功捕獲 '+stats.caught+' 隻','麻醉後逃脫 '+stats.escaped+' 隻','誤射家犬 '+stats.wrong+' 次']});
  }
  G.draw=()=>{
    ctx.drawImage(bg,0,0);
    ctx.save();
    ctx.setLineDash([8,8]); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(shooter.x,shooter.y,RANGE,Math.PI*1.08,Math.PI*1.92); ctx.stroke();
    ctx.restore();
    const sorted=dogs.slice().sort((a,b)=>a.y-b.y);
    for(const d of sorted){
      ctx.save();
      if(d.state==='asleep')ctx.globalAlpha=0.9;
      drawDog(ctx,d,clock,{still:d.state==='asleep'});
      ctx.restore();
      if(d.state==='asleep'){
        const p=d.sleep/d.sleepMax;
        ctx.strokeStyle=p>0.4?'#ffd37a':'#ff6b57'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(d.x,d.y,24,-Math.PI/2,-Math.PI/2+TAU*p); ctx.stroke();
        text(ctx,'Zzz',d.x+10,d.y-28+Math.sin(clock*3)*2,{s:13,w:800,c:'#fff',stroke:'rgba(0,0,0,.6)'});
      }else if(d.state==='drowsy'){
        text(ctx,'？',d.x,d.y-22,{s:15,w:800,a:'center',stroke:'rgba(0,0,0,.6)'});
      }
    }
    if(team){
      const k=clamp(team.t/team.dur,0,1), x=lerp(base.x,team.dog.x,k), y=lerp(base.y,team.dog.y,k);
      ctx.fillStyle='#2f6f8f'; ctx.beginPath(); ctx.arc(x,y,8,0,TAU); ctx.fill();
      ctx.fillStyle='#e6c29a'; ctx.beginPath(); ctx.arc(x,y,4.5,0,TAU); ctx.fill();
      ctx.strokeStyle='#6fe0e2'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(team.dog.x,team.dog.y,30,-Math.PI/2,-Math.PI/2+TAU*k); ctx.stroke();
    }
    for(const a of darts){
      const k=clamp(a.t/a.dur,0,1), x=lerp(a.sx,a.tx,k), y=lerp(a.sy,a.ty,k);
      const ang=Math.atan2(a.ty-a.sy,a.tx-a.sx);
      ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath();
      ctx.moveTo(x-Math.cos(ang)*12,y-Math.sin(ang)*12); ctx.lineTo(x,y); ctx.stroke();
      ctx.fillStyle='#ff6b57'; ctx.beginPath(); ctx.arc(x-Math.cos(ang)*12,y-Math.sin(ang)*12,2.5,0,TAU); ctx.fill();
    }
    const aa=Math.atan2(aim.y-shooter.y,aim.x-shooter.x);
    ctx.fillStyle='#2f6f8f'; ctx.beginPath(); ctx.ellipse(shooter.x,shooter.y,17,9,aa+Math.PI/2,0,TAU); ctx.fill();
    ctx.strokeStyle='#e8e2d2'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(shooter.x+Math.cos(aa)*6,shooter.y+Math.sin(aa)*6);
    ctx.lineTo(shooter.x+Math.cos(aa)*42,shooter.y+Math.sin(aa)*42); ctx.stroke();
    ctx.fillStyle='#e6c29a'; ctx.beginPath(); ctx.arc(shooter.x,shooter.y,7,0,TAU); ctx.fill();
    if(shell.state==='play'){
      const sw=sway(), cx=aim.x+sw.x, cy=aim.y+sw.y;
      const out=Math.hypot(cx-shooter.x,cy-shooter.y)>RANGE;
      const hov=dogs.find(d=>d.state==='asleep'&&!d.collar&&Math.hypot(d.x-aim.x,d.y-aim.y)<28);
      const col=hov?'#6fe0e2':out?'#ffb347':'#ffffff', r=11+sw.f*7;
      ctx.strokeStyle=col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-r-6,cy);ctx.lineTo(cx-4,cy);ctx.moveTo(cx+4,cy);ctx.lineTo(cx+r+6,cy);
      ctx.moveTo(cx,cy-r-6);ctx.lineTo(cx,cy-4);ctx.moveTo(cx,cy+4);ctx.lineTo(cx,cy+r+6);ctx.stroke();
      if(hov)text(ctx,'派隊員',cx,cy-r-12,{a:'center',s:13,w:700,c:col,stroke:'rgba(0,0,0,.6)'});
      else if(out)text(ctx,'射程外',cx,cy-r-12,{a:'center',s:13,w:700,c:col,stroke:'rgba(0,0,0,.6)'});
    }
    drawFloats(ctx,floats);
  };
  return G;
};

/* =====================================================
   模式三：無人機搜索
   ===================================================== */
MODES.drone=function(){
  const G={title:'無人機搜索躲藏犬隻',score:0,time:90,aimCanvas:true,layout:'below'};
  G.intro={h:'無人機搜索',l:[
    '按住畫面，無人機會飛向手指；電腦可用方向鍵或 WASD。畫面亮圈就是鏡頭看得到的範圍。',
    '一般鏡頭看不到樹叢底下的犬隻。開啟熱像可以穿過植被找熱源，但很耗電，電量用完任務就結束。',
    '熱源不一定是犬：人、機車、發電機也會發熱。犬在熱像中是橫向的橘色橢圓。',
    '把熱源放進中央圈，按住「鎖定目標」約 1 秒來確認。找到犬 +30 分；確認到非犬類扣 5 分、少 3 秒。4 隻全找到有時間獎勵。'
  ]};
  const R_N=95,R_T=72,LOCKR=42,TOTAL=4;
  let c,ctx,bg,off,drone,ents,canopies,roadY,thermal,battery,lockHeld,lockProg,lockTarget,wasHeld,floats,found,wrong,keys,ptr,clock,bT,bL;
  const LABEL={person:'人員',scooter:'機車引擎',gen:'發電機'};

  function build(){
    roadY=rand(170,290);
    const spots=[];
    function free(x,y,r,band){
      if(x<r+12||x>W-r-12||y<r+12||y>H-r-12)return false;
      if(band&&Math.abs(y-roadY)<r+30)return false;
      return spots.every(s=>Math.hypot(s.x-x,s.y-y)>s.r+r+8);
    }
    function place(r,band=true){
      for(let i=0;i<600;i++){
        const x=rand(r+12,W-r-12),y=rand(r+12,H-r-12);
        if(free(x,y,r,band)){spots.push({x,y,r});return {x,y};}
      }
      const x=rand(r+12,W-r-12),y=rand(r+12,H-r-12);spots.push({x,y,r});return {x,y};
    }
    const buildings=[];
    for(let i=0;i<3;i++){
      const w=rand(86,118),h=rand(56,76),p=place(Math.hypot(w,h)/2);
      buildings.push({x:p.x,y:p.y,w,h,tin:Math.random()<.5});
    }
    canopies=[];
    for(let i=0;i<4;i++){const r=rand(30,38),p=place(r);canopies.push({x:p.x,y:p.y,r,tree:true,dots:Array.from({length:12},()=>({a:rand(0,TAU),d:rand(0,.7),s:rand(2,5)}))});}
    for(let i=0;i<5;i++){const r=rand(20,26),p=place(r);canopies.push({x:p.x,y:p.y,r,tree:false,dots:Array.from({length:8},()=>({a:rand(0,TAU),d:rand(0,.7),s:rand(2,4)}))});}
    ents=[];
    const cs=canopies.slice().sort(()=>Math.random()-0.5);
    const under=(c0,kind)=>{
      const a=rand(0,TAU),d=rand(0,c0.r*0.35);
      return {kind,x:c0.x+Math.cos(a)*d,y:c0.y+Math.sin(a)*d,hidden:true};
    };
    const mk=(o)=>Object.assign({rot:rand(0,TAU),seed:Math.random()*10,done:false,color:pick(COLORS),patch:pick(PATCHES)},o);
    ents.push(mk(under(cs[0],'dog')));
    ents.push(mk(under(cs[1],'dog')));
    ents.push(mk(under(cs[2],'person')));
    for(let i=0;i<2;i++){const p=place(14);ents.push(mk({kind:'dog',x:p.x,y:p.y,hidden:false}));}
    {const p=place(14);ents.push(mk({kind:'person',x:p.x,y:p.y,hidden:false}));}
    {const p=place(14);ents.push(mk({kind:'gen',x:p.x,y:p.y,hidden:false}));}
    ents.push(mk({kind:'scooter',x:rand(80,720),y:roadY+rand(-8,8),hidden:false,rot:rand(-.2,.2)}));
    bg=makeBg(g=>{
      g.fillStyle='#6f9254'; g.fillRect(0,0,W,H);
      for(let i=0;i<6;i++){g.fillStyle=i%2?'rgba(190,200,110,.14)':'rgba(40,80,40,.12)';g.fillRect(rand(0,W-200),rand(0,H-120),rand(120,260),rand(60,140));}
      for(let i=0;i<1600;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.07)';g.fillRect(Math.random()*W,Math.random()*H,rand(1,3),rand(1,3));}
      g.fillStyle='#5a6166'; g.fillRect(0,roadY-18,W,36);
      g.fillStyle='rgba(255,255,255,.55)';
      for(let x=0;x<W;x+=44)g.fillRect(x,roadY-1,24,2);
      for(const b of buildings){
        g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(b.x-b.w/2+8,b.y-b.h/2+8,b.w,b.h);
        g.fillStyle=b.tin?'#9aa7ad':'#b36a50'; g.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
        g.strokeStyle='rgba(0,0,0,.3)'; g.lineWidth=2; g.strokeRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
        g.beginPath(); g.moveTo(b.x,b.y-b.h/2); g.lineTo(b.x,b.y+b.h/2); g.stroke();
      }
      g.bld=buildings;
    });
    bg.bld=buildings;
  }
  function drawCanopy(g,k){
    g.fillStyle='rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(k.x+5,k.y+7,k.r,k.r*.9,0,0,TAU); g.fill();
    const gr=g.createRadialGradient(k.x-k.r*.3,k.y-k.r*.3,k.r*.1,k.x,k.y,k.r);
    if(k.tree){gr.addColorStop(0,'#4d7c3a');gr.addColorStop(1,'#27481f');}
    else{gr.addColorStop(0,'#69964a');gr.addColorStop(1,'#3d6431');}
    g.fillStyle=gr; g.beginPath(); g.arc(k.x,k.y,k.r,0,TAU); g.fill();
    g.fillStyle='rgba(255,255,255,.08)';
    for(const d of k.dots){g.beginPath();g.arc(k.x+Math.cos(d.a)*d.d*k.r,k.y+Math.sin(d.a)*d.d*k.r,d.s,0,TAU);g.fill();}
  }
  function heat(g,x,y,rx,ry,rot,stops,al){
    g.save(); g.translate(x,y); g.rotate(rot); g.scale(rx,ry); g.globalAlpha=al;
    const gr=g.createRadialGradient(0,0,0,0,0,1);
    stops.forEach(s=>gr.addColorStop(s[0],s[1]));
    g.fillStyle=gr; g.beginPath(); g.arc(0,0,1,0,TAU); g.fill();
    g.restore();
  }
  function drawHeat(e){
    const fl=0.85+Math.sin(clock*5+e.seed)*0.08;
    if(e.kind==='dog'){
      heat(ctx,e.x,e.y,19,10.5,e.rot,[[0,'#fff3b0'],[.45,'#ffab40'],[1,'rgba(255,90,40,0)']],fl);
      heat(ctx,e.x+Math.cos(e.rot)*13,e.y+Math.sin(e.rot)*13,7,6.5,e.rot,[[0,'#ffffff'],[.5,'#ffc060'],[1,'rgba(255,120,40,0)']],fl);
    }else if(e.kind==='person'){
      heat(ctx,e.x,e.y,10,15,e.rot,[[0,'#fff6c8'],[.5,'#ffc866'],[1,'rgba(255,110,40,0)']],fl);
      heat(ctx,e.x,e.y,6,6,0,[[0,'#ffffff'],[1,'rgba(255,200,100,0)']],fl);
    }else if(e.kind==='scooter'){
      heat(ctx,e.x,e.y,24,5.5,e.rot,[[0,'#ff9a9a'],[.6,'#d94f8a'],[1,'rgba(120,40,160,0)']],0.8);
      heat(ctx,e.x+Math.cos(e.rot)*12,e.y+Math.sin(e.rot)*12,8,8,0,[[0,'#ffffff'],[.5,'#ffd27a'],[1,'rgba(255,120,40,0)']],fl);
    }else{
      heat(ctx,e.x,e.y,13,13,0,[[0,'#ffffff'],[.5,'#ffe08a'],[1,'rgba(255,140,40,0)']],1);
    }
  }
  function drawVisible(e){
    if(e.kind==='dog'){drawDog(ctx,{x:e.x,y:e.y,ang:e.rot,color:e.color,patch:e.patch,seed:e.seed,scale:1.15},clock,{still:true});}
    else if(e.kind==='person'){
      ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(e.x+2,e.y+3,10,6,0,0,TAU);ctx.fill();
      ctx.fillStyle='#d9534f';ctx.beginPath();ctx.ellipse(e.x,e.y,9,5.5,e.rot,0,TAU);ctx.fill();
      ctx.fillStyle='#e6c29a';ctx.beginPath();ctx.arc(e.x,e.y,4.2,0,TAU);ctx.fill();
    }else if(e.kind==='scooter'){
      ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-14,-1,30,9);
      ctx.fillStyle='#2f6f8f';ctx.fillRect(-16,-4,32,8);
      ctx.fillStyle='#222';ctx.fillRect(10,-8,3,16);
      ctx.restore();
    }else{
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(e.x-10,e.y-8,24,20);
      ctx.fillStyle='#e0902f';ctx.fillRect(e.x-12,e.y-10,24,20);
      ctx.strokeStyle='#5a3a10';ctx.lineWidth=2;ctx.strokeRect(e.x-12,e.y-10,24,20);
    }
  }
  function candidates(){
    const out=[];
    for(const e of ents){
      if(e.done)continue;
      const d=Math.hypot(e.x-drone.x,e.y-drone.y);
      if(d>LOCKR)continue;
      if(e.hidden&&!thermal)continue;
      out.push({e,d});
    }
    out.sort((a,b)=>a.d-b.d);
    return out;
  }
  function setThermal(v){
    if(v&&battery<=0)return;
    thermal=v;
    if(bT){bT.setAttribute('aria-pressed',v?'true':'false');bT.textContent=v?'熱像：開（耗電快）':'熱像：關';}
  }
  G.mount=o=>{
    c=o.canvas; ctx=o.ctx;
    o.extra.innerHTML='<div class="ctrl"><button class="tbtn" id="bT" aria-pressed="false">熱像：關</button><button class="tbtn" id="bL">按住鎖定目標</button></div><p class="hint">按住畫面讓無人機飛向手指。電腦：方向鍵或 WASD 移動，T 切換熱像，空白鍵鎖定。</p>';
    bT=o.extra.querySelector('#bT'); bL=o.extra.querySelector('#bL');
    bT.addEventListener('click',()=>{setThermal(!thermal);bT.blur();});
    bL.addEventListener('pointerdown',e=>{e.preventDefault();try{bL.setPointerCapture(e.pointerId);}catch(_){}lockHeld=true;bL.classList.add('held');});
    const rel=()=>{lockHeld=false;bL.classList.remove('held');};
    bL.addEventListener('pointerup',rel); bL.addEventListener('pointercancel',rel); bL.addEventListener('lostpointercapture',rel);
    const toC=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};};
    c.addEventListener('pointerdown',e=>{if(shell.state!=='play')return;e.preventDefault();try{c.setPointerCapture(e.pointerId);}catch(_){}const p=toC(e);ptr.down=true;ptr.x=p.x;ptr.y=p.y;});
    c.addEventListener('pointermove',e=>{if(!ptr.down)return;const p=toC(e);ptr.x=p.x;ptr.y=p.y;});
    const up=()=>{ptr.down=false;};
    c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up);
    off=bindKeys([
      ['keydown',e=>{
        if(inOverlay(e))return;
        const k=e.code;
        if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();
        if(k==='Space'){lockHeld=true;}
        else if(k==='KeyT'&&!e.repeat&&shell.state==='play')setThermal(!thermal);
        else keys[k]=true;
      }],
      ['keyup',e=>{
        if(inOverlay(e))return;
        if(e.code==='Space'){e.preventDefault();lockHeld=false;}
        keys[e.code]=false;
      }],
      ['blur',()=>{keys={};lockHeld=false;ptr.down=false;}]
    ]);
  };
  G.unmount=()=>{if(off)off();};
  G.reset=()=>{
    G.score=0;G.time=90;battery=100;thermal=false;lockHeld=false;lockProg=0;lockTarget=null;wasHeld=false;
    floats=[];found=0;wrong=0;keys={};ptr={down:false,x:0,y:0};clock=0;
    drone={x:W/2,y:H/2,vx:0,vy:0};
    build();
    setThermal(false);
  };
  G.hudExtra=()=>'電量 '+Math.round(battery)+'%　找到 '+found+'/'+TOTAL;
  G.update=dt=>{
    G.time-=dt; clock+=dt;
    let ix=0,iy=0;
    if(keys.ArrowLeft||keys.KeyA)ix-=1;
    if(keys.ArrowRight||keys.KeyD)ix+=1;
    if(keys.ArrowUp||keys.KeyW)iy-=1;
    if(keys.ArrowDown||keys.KeyS)iy+=1;
    if(ptr.down){
      const dx=ptr.x-drone.x,dy=ptr.y-drone.y,dd=Math.hypot(dx,dy);
      if(dd>6){const k=Math.min(1,dd/70);ix=dx/dd*k;iy=dy/dd*k;}
    }
    const l=Math.hypot(ix,iy); if(l>1){ix/=l;iy/=l;}
    const f=Math.min(1,dt*3.5);
    drone.vx+=(ix*185-drone.vx)*f; drone.vy+=(iy*185-drone.vy)*f;
    drone.x=clamp(drone.x+drone.vx*dt,10,W-10); drone.y=clamp(drone.y+drone.vy*dt,10,H-10);
    battery-=(thermal?2.6:0.45)*dt;
    if(thermal&&battery<=0)setThermal(false);
    // 鎖定
    if(lockHeld){
      const cand=candidates()[0];
      if(cand){
        if(lockTarget!==cand.e){lockTarget=cand.e;lockProg=0;}
        lockProg+=dt;
        if(lockProg>=1){
          const e=cand.e; e.done=true; lockProg=0; lockTarget=null;
          if(e.kind==='dog'){
            found++; G.score+=30; addFloat(floats,e.x,e.y-26,'找到犬隻 +30','#7dffb0');
          }else{
            wrong++; G.score=Math.max(0,G.score-5); G.time-=3;
            addFloat(floats,e.x,e.y-26,LABEL[e.kind]+'，不是犬 −5分 −3秒','#ff8a76');
          }
        }
      }else{
        lockProg=0; lockTarget=null;
        if(!wasHeld)addFloat(floats,drone.x,drone.y-LOCKR-12,'中央圈內沒有可見目標','#ffd37a');
      }
    }else{lockProg=Math.max(0,lockProg-dt*2);if(lockProg===0)lockTarget=null;}
    wasHeld=lockHeld;
    updFloats(floats,dt);
    if(found>=TOTAL){
      const bonus=Math.round(Math.max(0,G.time)*2); G.score+=bonus;
      finish({title:'全部找到了',lines:['4 隻犬隻都已確認','時間獎勵 +'+bonus+' 分','確認錯誤 '+wrong+' 次']});
    }else if(battery<=0){
      battery=0; finish({title:'電量耗盡，無人機返航',lines:['找到 '+found+'/'+TOTAL+' 隻','確認錯誤 '+wrong+' 次']});
    }else if(G.time<=0){
      G.time=0; finish({title:'時間到',lines:['找到 '+found+'/'+TOTAL+' 隻','確認錯誤 '+wrong+' 次']});
    }
  };
  G.draw=()=>{
    const R=thermal?R_T:R_N;
    ctx.drawImage(bg,0,0);
    // 開放地面上的目標（一般鏡頭、在亮圈內才看得到）
    if(!thermal){
      for(const e of ents){
        if(e.hidden)continue;
        if(Math.hypot(e.x-drone.x,e.y-drone.y)<R-6)drawVisible(e);
      }
    }
    for(const k of canopies)drawCanopy(ctx,k);
    // 熱像
    if(thermal){
      ctx.save();
      ctx.beginPath(); ctx.arc(drone.x,drone.y,R,0,TAU); ctx.clip();
      ctx.fillStyle='#0b1130'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(90,120,230,.5)'; ctx.lineWidth=1.5;
      for(const b of bg.bld)ctx.strokeRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
      ctx.setLineDash([4,4]);
      for(const k of canopies){ctx.beginPath();ctx.arc(k.x,k.y,k.r,0,TAU);ctx.stroke();}
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(60,70,150,.25)'; ctx.fillRect(0,roadY-18,W,36);
      for(const e of ents)drawHeat(e);
      ctx.restore();
    }
    // 亮圈以外變暗
    ctx.save();
    ctx.fillStyle='rgba(4,10,16,.5)';
    ctx.beginPath(); ctx.rect(0,0,W,H); ctx.arc(drone.x,drone.y,R,0,TAU); ctx.fill('evenodd');
    ctx.restore();
    ctx.strokeStyle=thermal?'#ffb347':'rgba(255,255,255,.85)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(drone.x,drone.y,R,0,TAU); ctx.stroke();
    // 已確認的標記
    for(const e of ents){
      if(!e.done)continue;
      const isDog=e.kind==='dog';
      ctx.strokeStyle=isDog?'#3be58a':'#9aa7ad'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(e.x,e.y,20,0,TAU); ctx.stroke();
      text(ctx,isDog?'已確認：犬':'非犬類',e.x,e.y-26,{s:12,w:700,a:'center',c:isDog?'#7dffb0':'#d5dde0',stroke:'rgba(0,0,0,.7)'});
    }
    // 中央鎖定圈
    ctx.save();
    ctx.setLineDash([4,5]); ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(drone.x,drone.y,LOCKR,0,TAU); ctx.stroke();
    ctx.restore();
    if(lockProg>0){
      ctx.strokeStyle='#ffe066'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(drone.x,drone.y,LOCKR,-Math.PI/2,-Math.PI/2+TAU*clamp(lockProg,0,1)); ctx.stroke();
    }
    // 無人機本體
    ctx.save(); ctx.translate(drone.x,drone.y);
    ctx.strokeStyle='#f4f7f8'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-9,-9);ctx.lineTo(9,9);ctx.moveTo(9,-9);ctx.lineTo(-9,9);ctx.stroke();
    ctx.fillStyle='#1b2a30'; ctx.beginPath(); ctx.arc(0,0,4,0,TAU); ctx.fill();
    for(const [px,py] of [[-10,-10],[10,-10],[-10,10],[10,10]]){
      ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(px,py,6,clock*30%TAU,clock*30%TAU+Math.PI*1.3); ctx.stroke();
    }
    ctx.restore();
    drawFloats(ctx,floats);
    if(battery<20&&Math.floor(performance.now()/400)%2===0)text(ctx,'電量偏低',W/2,28,{a:'center',s:16,w:800,c:'#ff8a76',stroke:'rgba(0,0,0,.7)'});
    text(ctx,thermal?'熱像鏡頭':'一般鏡頭',14,H-14,{s:12,w:700,c:thermal?'#ffb347':'#e8f1f1',stroke:'rgba(0,0,0,.7)'});
  };
  return G;
};

refreshBests();
})();
</script>
